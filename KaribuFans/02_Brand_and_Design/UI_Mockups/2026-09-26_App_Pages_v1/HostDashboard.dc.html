<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KaribuFans — Host dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F6F1E7}
a{color:#1F4D36}a:hover{color:#143424}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F1E7; font-family: 'DM Sans', system-ui, sans-serif; color: #1B1A17; display: flex; flex-direction: column">
<div style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 700; color: #7A4A0E">FOR HOSTS AND VENUES</div>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">Your dashboard</h1>
</div>
<div style="padding: 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 14px; border-radius: 14px; background: #1F4D36; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; color: #D6E3DA">Bookings</div><div style="font-size: 24px; font-weight: 700">[n]</div>
</div>
<div style="padding: 14px; border-radius: 14px; background: #1F4D36; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; color: #D6E3DA">M-Pesa payouts</div><div style="font-size: 24px; font-weight: 700">[KSh]</div>
</div>
</div>
<div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 15px">Upcoming guests</div>
<div style="padding: 12px 14px; background: #FFFFFF; border: 1px solid #E4DCCB; border-radius: 12px; display: flex; justify-content: space-between; font-size: 14px">
<span>[Guest] · from [country]</span><span style="font-weight: 700; color: #1F4D36">Paid</span>
</div>
<div style="padding: 12px 14px; background: #FFFFFF; border: 1px solid #E4DCCB; border-radius: 12px; display: flex; justify-content: space-between; font-size: 14px">
<span>[Guest] · from [country]</span><span style="font-weight: 700; color: #7A4A0E">Pending</span>
</div>
<div style="padding: 12px 14px; background: #FFFFFF; border: 1px solid #E4DCCB; border-radius: 12px; display: flex; justify-content: space-between; font-size: 14px">
<span>[Guest] · from [country]</span><span style="font-weight: 700; color: #1F4D36">Paid</span>
</div>
</div>
<div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 15px">Listing tools</div>
<button style="height: 48px; border: 1px solid #CFC4AE; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; text-align: left; padding: 0 14px">Auto-translate my listing (FR · AR · PT)</button>
<button style="height: 48px; border: 1px solid #CFC4AE; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; text-align: left; padding: 0 14px">Set matchday prices and blocked dates</button>
<button style="height: 48px; border: none; border-radius: 12px; background: #1F4D36; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">Add a new listing</button>
</div>
<div style="flex-grow: 1"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
