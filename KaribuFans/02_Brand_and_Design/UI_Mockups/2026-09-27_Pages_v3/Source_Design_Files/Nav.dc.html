<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KaribuFans navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="width: 1440px; height: 84px; box-sizing: border-box; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; gap: 28px; background: {{bg}}; color: {{fg}}; font-family: 'DM Sans', system-ui, sans-serif; border-bottom: {{rule}}">
<a href="Home_Desktop.dc.html" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: {{fg}}">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Karibu<span style="color: {{brand}}">Fans</span></span>
<svg width="96" height="5" viewBox="0 0 96 5" aria-hidden="true"><rect x="0" width="18" height="5" fill="#B8262B"></rect><rect x="19.5" width="18" height="5" fill="#2458A6"></rect><rect x="39" width="18" height="5" fill="#E3A23B"></rect><rect x="58.5" width="18" height="5" fill="#8A93B2"></rect><rect x="78" width="18" height="5" fill="#4F8A3C"></rect></svg>
</a>
<nav aria-label="Main" style="display: flex; gap: 22px; font-size: 15px; font-weight: 500">
<sc-for list="{{links}}" as="l" hint-placeholder-count="7">
<a href="{{l.href}}" style="color: {{fg}}; text-decoration: none; padding: 10px 0; border-bottom: {{l.line}}; font-weight: {{l.weight}}">{{l.label}}</a>
</sc-for>
</nav>
<div style="display: flex; gap: 12px; align-items: center">
<button type="button" aria-label="Change language" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: {{outline}}; background: transparent; font: 700 14px 'DM Sans', sans-serif; color: {{fg}}">EN</button>
<a href="Home_Desktop.dc.html#plan" style="min-height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 999px; background: {{ctaBg}}; color: {{ctaFg}}; font-weight: 700; font-size: 15px; text-decoration: none">Plan my trip</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","stays","food","nightlife","movies","rides","matchday","tickets"],"default":"home"},"mode":{"editor":"enum","options":["day","night"],"default":"day"},"$preview":{"width":1440,"height":84}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const night = (this.props.mode ?? 'day') === 'night';
const accent = night ? '#F5A623' : '#1F4D2B';
const items = [
['stays', 'Stays', 'Stays.dc.html'], ['food', 'Food', 'Food.dc.html'], ['rides', 'Rides', 'Rides.dc.html'], ['matchday', 'Matchday', 'Matchday.dc.html'],
['nightlife', 'Nightlife', 'Nightlife.dc.html'], ['movies', 'Movies & Games', 'Movies_Games.dc.html'], ['tickets', 'Tickets', 'Tickets.dc.html']
];
return {
bg: night ? '#0B1128' : '#F7F2E8',
fg: night ? '#F3F5FA' : '#16201A',
brand: accent,
rule: night ? '1px solid rgba(243,245,250,0.12)' : '1px solid rgba(22,32,26,0.1)',
outline: night ? '1px solid rgba(243,245,250,0.35)' : '1px solid rgba(22,32,26,0.25)',
ctaBg: accent,
ctaFg: night ? '#0B1128' : '#F7F2E8',
links: items.map(([key, label, href]) => ({
label, href,
line: key === active ? '3px solid ' + accent : '3px solid transparent',
weight: key === active ? '700' : '500'
}))
};
}
}
</script>
</body>
</html>
