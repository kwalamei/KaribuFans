<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KaribuFans Matchday</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>body{margin:0;background:#0B1128;font-family:'DM Sans',system-ui,sans-serif;color:#F3F5FA}a{color:#F5A623}a:hover{color:#F3F5FA}</style>
</helmet>
<div style="width: 1440px; height: 3300px; box-sizing: border-box; background: #0B1128; display: flex; flex-direction: column; font-family: 'DM Sans', system-ui, sans-serif; color: #F3F5FA">
<dc-import name="Nav" active="matchday" mode="night" hint-size="1440px,84px"></dc-import>

<dc-import name="PageHero" stop="4" eyebrow="Stop 4 · Matchday" script="Siku ya mechi." heading="Matchday at Talanta Stadium." sub="Fixtures, gate times, what to bring, fan zones and watch parties. Official details are added as the organisers publish them." img="/_blob/e9487762242e37a555c2bcac3a57229c" alt="Dusk view of the expressway with light trails leading to a floodlit stadium" pos="70% 50%" slot="MATCH-01" hint-size="1440px,640px"></dc-import>

<section id="fixtures" style="flex-shrink: 0; padding: 24px 72px 48px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 30px">Matches in Nairobi</h2><span style="font-size: 14px; color: #B9C0D6">Fixtures added once officially published</span></div>
<div style="display: flex; flex-direction: column; border: 1px solid rgba(243,245,250,0.14); border-radius: 16px; overflow: hidden">
<sc-for list="{{fixtures}}" as="f" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 180px 1.6fr 1fr auto; gap: 24px; align-items: center; padding: 20px 24px; border-bottom: 1px solid rgba(243,245,250,0.1)">
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px; color: #F5A623">[Date]</strong><span style="font-size: 13px; color: #B9C0D6">{{f.stage}}</span></div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 24px">[Team A] vs [Team B]</span>
<span style="font-size: 15px; color: #D9DDEA">Kick-off [time] · Gates open [time]</span>
<div style="display: flex; gap: 8px">
<a href="Home_Desktop.dc.html#plan" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; background: #F5A623; color: #0B1128; font-weight: 700; font-size: 14px; text-decoration: none">Plan this match</a>
<a href="Tickets.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; border: 1px solid rgba(243,245,250,0.35); color: #F3F5FA; font-weight: 700; font-size: 14px; text-decoration: none">Tickets</a>
</div>
</div>
</sc-for>
</div>
</section>

<section style="flex-shrink: 0; padding: 0 72px 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<div style="grid-column: 1 / 4; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 30px">Stadium essentials</div>
<sc-for list="{{essentials}}" as="e" hint-placeholder-count="6">
<div style="background: #131C40; border-radius: 16px; padding: 22px; display: flex; gap: 16px; align-items: flex-start">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #1B2656; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.d}}"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">{{e.t}}</strong><span style="font-size: 15px; line-height: 1.5; color: #D9DDEA">{{e.v}}</span></div>
</div>
</sc-for>
</section>

<section style="flex-shrink: 0; padding: 0 72px 56px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 30px">Fan zones and watch parties</h2><a href="#all" style="font-weight: 700">See all</a></div>
<div style="display: grid; grid-template-columns: repeat(4, 300px); gap: 32px">
<sc-for list="{{cards}}" as="it" hint-placeholder-count="4">
<dc-import name="VendorCard" item="{{it}}" mode="night" hint-size="300px,420px"></dc-import>
</sc-for>
</div>
</section>

<div style="flex-grow: 1; background: #0B1128; display: flex; flex-direction: column; justify-content: flex-end">
<dc-import name="Footer" hint-size="1440px,360px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3300}}'>
class Component extends DCLogic {
renderVals() {
const card = (slot, badge, name, meta, tags, note, primary) => ({ slot, badge, name, meta, tags, note, primary, secondary: 'Map' });
return {
fixtures: [ { stage: 'Group [X] · Match [#]' }, { stage: 'Group [X] · Match [#]' }, { stage: 'Group [X] · Match [#]' }, { stage: 'Knockout [TBC]' } ],
essentials: [
{ t: 'Gates and entry', v: 'Gates open [X] h before kick-off. Entry at gate [X] as printed on your ticket.', d: 'M4 21V8l8-5 8 5v13M9 21v-6h6v6' },
{ t: 'Bags and banned items', v: '[As set by the organisers. We link the official list once published.]', d: 'M6 8h12l-1 12H7zM9 8V6a3 3 0 0 1 6 0v2' },
{ t: 'Getting there', v: 'Leave early. Use the official pickup zones on the Rides page.', d: 'M3 13l2-5h14l2 5v5h-3v-2H6v2H3z' },
{ t: 'Accessibility', v: '[Accessible entrances, seating and drop-off points TBC]', d: 'M12 4a1.5 1.5 0 1 0 0 .01M8 9h8M12 9v5l-3 6M12 14l3 6' },
{ t: 'Weather', v: 'Nairobi evenings can be cool. Bring a light jacket.', d: 'M17 18a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 6 18z' },
{ t: 'Payments inside', v: '[Cash or M-Pesa at stadium kiosks TBC]', d: 'M3 7h18v10H3zM3 11h18' }
],
cards: [
card('MATCH-02', 'Fan zone', '[Fan zone name]', '[Area] · Free entry [TBC]', ['Big screen', 'Food stalls'], 'Opens [time] on matchdays', 'Directions'),
card('MATCH-02', 'Watch party', '[Venue name]', '[Area] · Entry KES [X]', ['Screens', 'Groups'], '[Team] supporters meet-up', 'Reserve'),
card('NIGHT-03', 'Watch party', '[Bar name]', '[Area] · No entry fee', ['Screens', 'Food'], 'Shows every match', 'Reserve'),
card('MATCH-02', 'Fan zone', '[Fan zone name]', '[Area] · Free entry [TBC]', ['Music', 'Family'], 'Opens [time]', 'Directions')
]
};
}
}
</script>
</body>
</html>
