{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ site.name }}{% endblock %}
{% block main %}
<section class="band">
  <div class="wrap" style="max-width:820px;display:flex;flex-direction:column;gap:18px">
    <div class="eyebrow on-light" style="color:var(--canopy)">{{ page.eyebrow }}</div>
    <h1 style="font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1">{{ page.title }}</h1>
    <p style="font-size:18px;color:#33403A">{{ page.body }}</p>
    <a class="btn btn-green" style="align-self:flex-start" href="{{ root }}">Back to the homepage</a>
  </div>
</section>
{% endblock %}
